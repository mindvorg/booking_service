version: '3.1'
services:
  postgres-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: booking_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'

  back:
    build: ./backend
    ports:
      - '8081:8080'
    depends_on:
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/booking_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin

  front:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - back

  nginx:
    image: nginx:alpine
    ports:
      - '8080:80'
    volumes:
      - ./backend/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - back
      - front

volumes:
  postgres-data:
